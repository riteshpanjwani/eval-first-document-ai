[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "eval-first-document-ai"
version = "0.1.0"
description = "Evaluation-first OCR, contract extraction, and cited retrieval reference implementation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Ritesh Panjwani" }]
dependencies = [
  "pydantic>=2.10,<3",
  "pymupdf>=1.25,<2",
  "pillow>=11,<13",
  "numpy>=2,<3",
  "rapidocr>=3.4,<4",
  "onnxruntime>=1.20,<2",
  "reportlab>=4.2,<5",
  "typer>=0.15,<1",
  "rich>=13.9,<15",
]

[project.optional-dependencies]
app = ["streamlit>=1.41,<2", "pandas>=2.2,<3"]
llm = ["openai>=1.60,<3"]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
eval-docai = "evaldocai.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/evaldocai"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
